[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ag-pii-vault"
version = "0.6.0"
description = "PII tokenization SDK and proxy for AI pipelines"
authors = ["Adnan Ghribi <aghribi@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/aghribi/ag-pii-vault"
repository = "https://github.com/aghribi/ag-pii-vault"
packages = [{ include = "ag_pii_vault" }]

[tool.poetry.dependencies]
python = "^3.10"
presidio-analyzer = "^2.2"
spacy = "^3.7"
# preshed 3.0.14 breaks spaCy model loading (OverflowError in from_disk)
preshed = "!=3.0.14"
pydantic = "^2.0"
phonenumbers = "^8.13"
httpx = ">=0.27,<1"

[tool.poetry.extras]
openai    = ["openai"]
anthropic = ["anthropic"]
all       = ["openai", "anthropic"]

[tool.poetry.dependencies.openai]
version  = "^1.0"
optional = true

[tool.poetry.dependencies.anthropic]
version  = "^0.25"
optional = true

[tool.poetry.group.dev.dependencies]
pytest            = "^8.0"
pytest-asyncio    = "^0.23"
black             = "^24.0"
ruff              = "^0.4"
openai            = "^1.0"
anthropic         = "^0.25"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
